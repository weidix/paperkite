<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纸鸢 · 消息检索</title>
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="query-shell">
      <header class="topbar">
        <h1>消息检索</h1>
      </header>

      <section class="workspace">
        <aside class="sidebar panel">
          <section class="form-section">
            <h2>检索条件</h2>
            <form id="query-form" class="stack-form">
              <label>结构化关键词
                <input type="text" name="keyword" placeholder="多个关键词用空格分隔，例如 clash 节点 香港" />
              </label>
              <label>不显示关键词
                <input type="text" name="exclude_keyword" placeholder="多个关键词用空格分隔，例如 广告 抽奖" />
              </label>
              <label>群组名称
                <input type="text" name="chat_title" placeholder="支持模糊匹配，例如 技术群" />
              </label>
              <label>时间筛选
                <select id="time-mode" name="time_mode">
                  <option value="include" selected>包含时间区间</option>
                  <option value="exclude">不包含时间区间</option>
                  <option value="off">不按时间筛选</option>
                </select>
              </label>
              <label>开始时间
                <input type="datetime-local" name="date_from" />
              </label>
              <label>结束时间
                <input type="datetime-local" name="date_to" />
              </label>
              <button type="submit" class="query-button">查询</button>
            </form>
          </section>
        </aside>

        <section class="result-panel panel">
          <h2>查询结果</h2>
          <p id="result-meta">暂无结果</p>
          <div class="table-wrap">
            <table>
              <colgroup>
                <col class="col-text" />
                <col class="col-detail" />
              </colgroup>
              <thead>
                <tr>
                  <th>消息内容</th>
                  <th>详情</th>
                </tr>
              </thead>
              <tbody id="result-body"></tbody>
            </table>
          </div>
          <div class="pager">
            <button id="result-prev" type="button" class="ghost-button">上一页</button>
            <span id="result-page">第 0 / 0 页</span>
            <button id="result-next" type="button" class="ghost-button">下一页</button>
          </div>
        </section>
      </section>

      <aside id="context-panel" class="context-panel" aria-hidden="true">
        <div class="context-header">
          <h2>同群上下文</h2>
          <button id="context-close" type="button" class="ghost-button">关闭</button>
        </div>
        <div class="context-controls">
          <p class="context-tip">一次加载当前消息附近的完整上下文，滚动时列表不再动态改写。</p>
          <button id="context-center-anchor" type="button" class="ghost-button">回到当前消息</button>
        </div>
        <p id="context-meta">请选择一条消息查看上下文</p>
        <div id="context-list" class="context-list"></div>
      </aside>
    </main>
  </body>
</html>
