telegram:
  apiId: 123456
  apiHash: replace-with-your-api-hash
  sessionsDir: accounts
  sessionGuard:
    windowMs: 60000
    threshold: 5
    backoffMinMs: 30000
    backoffMaxMs: 1800000

logging:
  level: info
  directory: logs

plugins:
  manifest: "@paperkite/bundles"
  registry: "https://registry.npmjs.org"
  autoInstall: true
  manifestTtlHours: 24
  scopes:
    - "@paperkite/"
